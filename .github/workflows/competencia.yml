name: Competencia RL

on:
  # pull_request_target (y no pull_request) para que los PRs desde FORKS tengan
  # acceso a EVAL_SEEDS. Corre SIEMPRE el workflow y el harness de main, nunca
  # los del PR. REGLA DE SEGURIDAD: de la rama del PR solo se lee el .onnx como
  # DATOS (git show); jamás se hace checkout de su código ni se ejecuta nada suyo,
  # y ningún valor que venga del PR se interpola con ${{ }} en un `run:`.
  pull_request_target:
    paths: ["submissions/**"]
  push:
    branches: [main]
    # config.yaml: si cambian los circuitos, el board se re-evalúa solo.
    paths: ["submissions/**", "config.yaml"]
  workflow_dispatch:        # para correr el board manualmente el día D

permissions:
  contents: read            # mínimo por defecto; cada job pide lo suyo

jobs:
  # ----------------------------------------------------------------
  # En PR: valida (código = descalificado) y comenta el score de preview.
  # ----------------------------------------------------------------
  evaluar-pr:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # para comentar el score en el PR
    # Si el alumno pushea de nuevo, la corrida vieja de ese PR ya no sirve.
    concurrency:
      group: evaluar-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}   # entero, seguro
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Checkout de main (código confiable). Sin credenciales guardadas en .git.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r harness/requirements.txt

      - name: Traer el PR (solo como datos) y validar
        id: validar
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/validacion.txt"; : > "$OUT"
          CHANGED="$RUNNER_TEMP/changed.txt"

          # Los commits del PR (aunque vengan de un fork) quedan en refs/pull/N/head.
          git fetch --no-tags --quiet origin "+refs/pull/${PR_NUMBER}/head:refs/pr/head"
          git diff --name-only HEAD...refs/pr/head > "$CHANGED"
          echo "Archivos en el PR:"; cat "$CHANGED"

          invalida() {
            printf '%s\n' "$1" | tee "$OUT"
            echo "estado=invalida" >> "$GITHUB_OUTPUT"
            exit 1
          }

          TEAMS=$(sed -n 's|^submissions/\([^/]*\)/.*|\1|p' "$CHANGED" | sort -u)
          N=$(printf '%s' "$TEAMS" | grep -c . || true)
          if [ "$N" -eq 0 ]; then
            echo "estado=sin-submission" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$N" -gt 1 ] && invalida "El PR toca más de una carpeta de equipo ($(echo $TEAMS)). Un PR = un equipo."
          TEAM="$TEAMS"
          [[ "$TEAM" =~ ^[A-Za-z0-9_-]+$ ]] || invalida "Nombre de carpeta no válido: solo letras sin tildes, números, '-' y '_'."
          [ "$TEAM" = "_ejemplo" ] && invalida "submissions/_ejemplo/ es la carpeta de ejemplo: subí tu policy en submissions/<tu-equipo>/."
          git cat-file -e "refs/pr/head:submissions/$TEAM/policy.onnx" 2>/dev/null \
            || invalida "Falta submissions/$TEAM/policy.onnx en el PR."

          git show "refs/pr/head:submissions/$TEAM/policy.onnx" > "$RUNNER_TEMP/policy.onnx"
          echo "team=$TEAM" >> "$GITHUB_OUTPUT"

          if python harness/validate_submission.py \
               --changed-files "$(tr '\n' ' ' < "$CHANGED")" \
               --onnx "$RUNNER_TEMP/policy.onnx" 2>&1 | tee "$OUT"; then
            echo "estado=valida" >> "$GITHUB_OUTPUT"
          else
            echo "estado=invalida" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Evaluar con seeds ocultas
        if: steps.validar.outputs.estado == 'valida'
        env:
          EVAL_SEEDS: ${{ secrets.EVAL_SEEDS }}   # set OCULTO de ranking
          TEAM: ${{ steps.validar.outputs.team }}  # ya validado contra [A-Za-z0-9_-]
        run: |
          python harness/evaluate.py \
            --onnx "$RUNNER_TEMP/policy.onnx" \
            --team "$TEAM" \
            --out "$RUNNER_TEMP/result.json" \
            --md "$RUNNER_TEMP/result.md"

      - name: Comentar en el PR
        if: always() && steps.validar.outputs.estado != ''
        env:
          ESTADO: ${{ steps.validar.outputs.estado }}
        run: |
          C="$RUNNER_TEMP/comment.md"
          case "$ESTADO" in
            valida)
              if [ -f "$RUNNER_TEMP/result.md" ]; then
                {
                  echo "✅ Submission válida — score de preview en cada circuito (seeds ocultas):"
                  echo ''
                  cat "$RUNNER_TEMP/result.md"
                  echo ''
                  echo "Los puntos del campeonato dependen de la posición contra las demás escuderías y solo suma el titular de cada una (su auto con más puntos): se calculan al mergear a \`main\`, en el [leaderboard](https://github.com/$GH_REPO/blob/main/LEADERBOARD.md)."
                } > "$C"
              else
                echo "⚠️ La submission es válida pero la evaluación falló. Avisale al profe." > "$C"
              fi
              ;;
            invalida)
              {
                echo "❌ Submission inválida:"
                echo '```'
                sed 's/^::error:://' "$RUNNER_TEMP/validacion.txt"
                echo '```'
                echo "Corregí, commiteá y pusheá a la misma rama: el bot vuelve a correr solo."
              } > "$C"
              ;;
            sin-submission)
              echo "ℹ️ Este PR no modifica ninguna \`submissions/<equipo>/policy.onnx\`, así que no hay score de preview. El board oficial se actualiza al mergear a \`main\`." > "$C"
              ;;
          esac
          gh pr comment "$PR_NUMBER" --body-file "$C"

  # ----------------------------------------------------------------
  # En push a main (post-merge): re-evalúa, guarda result y regenera board.
  # ----------------------------------------------------------------
  actualizar-board:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Una sola corrida del board a la vez: si se mergean varios PRs seguidos,
    # dos corridas en paralelo pisaban el push del board y la segunda fallaba.
    # Sin cancel-in-progress: la que está corriendo termina; de las encoladas
    # sobrevive la última (que igual re-evalúa TODAS las submissions).
    # Grupo por rama: una corrida de prueba en otra rama no cancela ni demora
    # las de main.
    concurrency:
      group: actualizar-board-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write       # para commitear results/ y LEADERBOARD.md
    steps:
      # Historia completa: la escudería de cada auto sale de los merge commits
      # de origin/main (harness/escuderias.py).
      # ref = la PUNTA de la rama, no el commit del evento: una corrida que
      # estuvo encolada arranca desde el board que commiteó la anterior (si no,
      # las dos regeneran LEADERBOARD.md y el rebase del final choca).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r harness/requirements.txt

      # Rama de prueba (p.ej. campeonato, corrida con "Run workflow"): evalúa
      # las submissions que hay HOY en main, sin tocar main.
      - name: Traer las submissions de main (solo fuera de main)
        if: github.ref_name != 'main'
        run: |
          git fetch --no-tags --quiet origin main
          git checkout FETCH_HEAD -- submissions/

      - name: Evaluar submissions nuevas/cambiadas
        env:
          EVAL_SEEDS: ${{ secrets.EVAL_SEEDS }}
        run: |
          for d in submissions/*/; do
            team=$(basename "$d")
            [ "$team" = "_ejemplo" ] && continue
            [ -f "$d/policy.onnx" ] || continue
            python harness/validate_submission.py --onnx "$d/policy.onnx" || continue
            python harness/evaluate.py --onnx "$d/policy.onnx" --team "$team"
          done

      - name: Regenerar leaderboard
        run: python harness/make_leaderboard.py

      - name: Commit del board
        run: |
          git config user.name  "rl-bot"
          git config user.email "rl-bot@users.noreply.github.com"
          git add results/ LEADERBOARD.md
          git diff --cached --quiet || git commit -m "Actualizar leaderboard [skip ci]"
          # Si mientras evaluábamos se mergeó otro PR, la rama avanzó: traer esos
          # commits antes de pushear (solo tocan submissions/, no hay conflicto).
          # Contra la rama que se está corriendo (main, o otra con workflow_dispatch).
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
